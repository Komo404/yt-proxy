<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YT Embed Proxy</title>
    <style>
        *, *::before, *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            background: #000;
            overflow: hidden;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }

        .error {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 8px;
            height: 100%;
            color: #aaa;
            font-family: system-ui, sans-serif;
            font-size: 13px;
        }

        .error span {
            color: #555;
            font-size: 11px;
        }
    </style>
</head>
<body>
    <script>
        const params = new URLSearchParams(window.location.search);

        const videoId  = params.get('v');
        const autoplay = params.get('autoplay') ?? '1';
        const mute     = params.get('mute')     ?? '1';
        const start    = params.get('start')    ?? null;

        if (!videoId) {
            document.body.innerHTML = `
                <div class="error">
                    No video ID provided!
                    <span>Usage ex: ?v=VIDEO_ID&autoplay=1&mute=1</span>
                </div>`;
        } else {
            const embedParams = new URLSearchParams({
                autoplay,
                mute,
                rel: '0',
                modestbranding: '1'
            });

            if (start) embedParams.set('start', start);

            const iframe = document.createElement('iframe');
            iframe.src = `https://www.youtube-nocookie.com/embed/${videoId}?${embedParams}`;
            iframe.allow = 'autoplay; encrypted-media; picture-in-picture; fullscreen';
            iframe.allowFullscreen = true;

            document.body.appendChild(iframe);
        }
    </script>
</body>
</html>
